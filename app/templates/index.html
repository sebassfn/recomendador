{% extends "base.html" %}
{% block title %}¿Qué necesitas resolver? — Recomendador{% endblock %}
{% block content %}
<form action="/mission" method="post" class="space-y-4">
  <h1 class="text-xl md:text-2xl font-semibold text-center">¿Qué necesitas resolver?</h1>

  <textarea
    id="mission-text"
    name="text"
    maxlength="500"
    rows="3"
    placeholder="Ej: Me voy con los niños a la playa el feriado"
    class="w-full rounded-lg border border-slate-300 p-3 focus:outline-none focus:ring-2 focus:ring-slate-400"
  ></textarea>

  <div class="flex flex-col md:flex-row gap-2">
    {% for chip in seed_chips %}
    <button
      type="button"
      onclick='document.getElementById("mission-text").value = {{ chip.text | tojson }};'
      class="w-full md:w-auto min-h-[44px] px-4 py-2 rounded-full border border-slate-300 bg-white text-sm hover:bg-slate-100"
    >{{ chip.label }}</button>
    {% endfor %}
  </div>

  <div class="flex flex-col md:flex-row gap-3 items-stretch md:items-center">
    <label class="flex-1 text-sm">
      Presupuesto (opcional)
      <input
        type="number" name="budget" min="0" step="0.01"
        class="mt-1 w-full rounded-lg border border-slate-300 p-2"
        placeholder="Sin restricción"
      />
    </label>
    <button
      type="submit"
      class="min-h-[44px] px-6 py-2 rounded-lg bg-slate-900 text-white font-medium hover:bg-slate-700"
    >Armar mi canasta →</button>
  </div>
</form>
{% endblock %}
