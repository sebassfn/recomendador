{#- Conversación. `vm.conversation` = tuple[TurnVM]. -#}
<section class="space-y-3">
  {% for turn in vm.conversation %}
    {% if turn.role == "user" %}
      <div class="flex items-start gap-3">
        <div class="shrink-0 w-9 h-9 rounded-full bg-slate-300 flex items-center justify-center" aria-hidden="true">🙂</div>
        <div class="bg-blue-50 border border-blue-100 rounded-2xl rounded-tl-sm px-4 py-3 text-sm">{{ turn.text }}</div>
      </div>
    {% else %}
      <div class="flex items-start gap-3">
        <div class="shrink-0 w-9 h-9 rounded-full bg-blue-100 flex items-center justify-center" aria-hidden="true">🤖</div>
        <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-sm px-4 py-3 text-sm">
          <p>{{ turn.text }}</p>
          {% if turn.detail %}<p class="mt-1 text-xs text-slate-400">{{ turn.detail }}</p>{% endif %}
        </div>
      </div>
    {% endif %}
  {% endfor %}
</section>
