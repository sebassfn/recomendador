{#- Una categoría. `group` = RecommendationGroupVM. -#}
<section class="rounded-2xl border p-3 md:p-4 {{ group.css }}" id="group-{{ group.category_value }}">
  <header class="flex flex-wrap items-baseline gap-x-3 gap-y-1 mb-3">
    <h3 class="text-lg font-semibold flex items-center gap-2"><span aria-hidden="true">{{ group.icon }}</span>{{ group.title }}</h3>
    <p class="text-sm text-slate-500">{{ group.subtitle }}</p>
  </header>

  {% if group.cards %}
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">
      {% for card in group.cards %}
        {% include "partials/product_card.html" %}
      {% endfor %}
    </div>
  {% endif %}

</section>
